<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LP Furniture Catalog Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{--bg:#FFFEFB;--panel:#F7F1E6;--line:#E6DAC6;--cream:#2B1A12;--mute:#6B5748;--gold:#C98F2B;--gold-2:#8A5A12;--ink:#1B100A;--focus:#9A6410;
--f-display:'Playfair Display',Georgia,serif;--f-body:'DM Sans','Segoe UI',system-ui,sans-serif;--nav-h:68px;--gut:clamp(12px,3vw,40px);--page:clamp(16px,4vw,64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
/* ---------- smart nav ---------- */
.snav{position:fixed;top:12px;left:clamp(12px,3vw,40px);right:clamp(12px,3vw,40px);z-index:50;height:var(--nav-h);pointer-events:none}
.snav>*{pointer-events:auto}
.bar{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 10px 8px 22px;border-radius:18px;
  background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 30px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  transition:background .35s ease,border-color .35s ease,box-shadow .35s ease,backdrop-filter .35s ease}
.logo{position:relative;z-index:2;font-family:var(--f-display);font-size:1.4rem;font-weight:600;color:var(--gold-2);white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;padding:0 4px;
  transition:text-shadow .35s ease,transform .35s ease}
.logo em{color:#fff;font-style:italic;font-weight:600}
.links{display:flex;align-items:center;gap:4px;transition:opacity .28s ease,transform .32s ease}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:.9rem;color:#fff;position:relative;transition:background .18s}
.links a:hover{background:rgba(255,236,200,.14)}
.links a svg.ic{width:19px;height:19px;flex:none;color:var(--gold-2)}
.links a .cnt{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold);color:#2B1A12;font-size:.7rem;font-weight:700;display:inline-grid;place-items:center;margin-left:-1px}
.links a .pip{width:9px;height:9px;border-radius:50%;background:#E3AE4A;box-shadow:0 0 0 2px rgba(26,14,9,.9);margin-left:-3px;align-self:flex-start;margin-top:10px}
.links a.cur::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;background:var(--gold)}
.links a.ghost{border:1.5px solid rgba(255,236,200,.5);margin-left:6px}
.links a.solid{background:linear-gradient(180deg,#E7B654,#D9A441);color:#2B1A12;box-shadow:0 6px 14px -6px rgba(217,164,65,.8),inset 0 1px 0 rgba(255,255,255,.45)}
.burger{all:unset;display:none;box-sizing:border-box;cursor:pointer;width:48px;height:48px;border-radius:14px;border:1.5px solid rgba(255,236,200,.5);position:relative;flex:none}
.burger span{position:absolute;left:13px;right:13px;height:2.5px;border-radius:2px;background:#fff}
.burger span:nth-child(1){top:16px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:28px}

/* collapsed: bar background and links melt away, logo stays put with a soft dark halo */
.snav.collapsed .bar{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.snav.collapsed .links,.snav.collapsed .burger{opacity:0;transform:translateY(-10px);visibility:hidden;transition:opacity .25s ease,transform .3s ease,visibility 0s .3s}
.snav.collapsed .logo{transform:translate(calc(-1 * (22px + var(--gut) - 14px)),-22px) scale(.84);transform-origin:left center;-webkit-text-stroke:1.6px rgba(24,12,7,.62);paint-order:stroke fill;text-shadow:0 1px 1px rgba(15,7,3,.35)}
.snav.collapsed .bar{pointer-events:none}
.snav.collapsed .logo{pointer-events:auto}
@media (max-width:1180px){.links a{padding:0 9px;font-size:.86rem}.links{gap:2px}}
@media (max-width:1000px){
  .burger{display:block}.links{display:none}
  .snav.open .bar{position:relative;inset:auto;height:auto;flex-wrap:wrap;background:rgba(26,14,9,.92)}
  .links a.cur::after{display:none}.links a.cur{background:rgba(255,236,200,.1)}
  .links a .pip{margin-top:0;align-self:center;margin-left:2px}
  .snav.open .links{display:flex;flex-direction:column;align-items:stretch;flex-basis:100%;order:3;padding:10px 4px 6px;margin-top:8px;border-top:1px solid var(--line)}
  .snav.open .links a{min-height:48px;font-size:1rem}
  .snav.open{height:auto}
}


.snav .bar{border:1px solid rgba(255,236,200,.28)}
.links a{color:#fff}
.snav .bar{box-shadow:0 14px 30px -16px rgba(43,26,18,.6)}


/* glass nav: translucent so it blurs what it covers, and it flips to a light variant over light areas */
.snav .bar{background:rgba(36,21,13,.6);border:1px solid rgba(255,236,200,.3);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 14px 30px -16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.snav:not(.light) .logo{color:#F1D391}.snav:not(.light) .links a svg.ic{color:#F1D391}
.snav.light .bar{background:rgba(255,252,246,.62);border:1px solid rgba(90,53,36,.18);box-shadow:0 14px 30px -18px rgba(43,26,18,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.snav.light .logo{color:#8A5A12}.snav.light .logo em{color:#2B1A12}
.snav.light .links a{color:#2B1A12}.snav.light .links a:hover{background:rgba(90,53,36,.09)}
.snav.light .links a svg.ic{color:#8A5A12}
.snav.light .links a .pip{box-shadow:0 0 0 2px rgba(255,252,246,.95)}
.snav.light .links a.cur::after{background:#B7791F}
.snav.light .burger{border-color:rgba(90,53,36,.4)}.snav.light .burger span{background:#2B1A12}
.snav.light.collapsed .bar{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.snav.light.collapsed .logo{-webkit-text-stroke:0;text-shadow:0 0 10px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9)}
.snav.light.open .bar{background:rgba(255,252,246,.94)}
@media (max-width:1000px){.snav.open .bar{background:rgba(36,21,13,.92)}.snav.light.open .bar{background:rgba(255,252,246,.94)}}
.dk{margin-top:60px;background:#1B100A;color:#F4E8D2;padding:70px var(--page) 90px;text-align:center;min-height:60vh}
.dk b{display:block;font-family:var(--f-display);font-size:1.6rem;margin-bottom:8px;font-weight:600}.dk span{color:#CDB99C}
.shell{max-width:1500px;margin:0 auto;padding:calc(var(--nav-h) + 56px) var(--page) 90px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(28px,4vw,64px)}
/* left index */
.idx{position:sticky;top:96px;align-self:start}
.idx h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,4vw,3.4rem);line-height:1;margin:0 0 12px;letter-spacing:-.01em}
.idx .lede{margin:0 0 26px;color:var(--mute);line-height:1.6;font-size:.95rem}
.cats{list-style:none;margin:0 0 22px;padding:0;border-top:1px solid var(--line)}
.cats button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:1.18rem;color:var(--cream);transition:padding .2s,color .2s}
.cats button small{font-family:var(--f-body);font-size:.84rem;color:var(--mute)}
.cats button:hover{padding-left:12px;color:var(--gold-2)}
.cats button[aria-pressed="true"]{color:var(--gold-2);padding-left:14px;box-shadow:inset 3px 0 0 var(--gold)}
.cats button[aria-pressed="true"] small{color:var(--gold-2)}
.cats button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.field{display:block;margin-bottom:12px;position:relative}
.field input,.field select{width:100%;min-height:46px;border-radius:12px;border:1.5px solid #D8C8AC;background:#fff;color:var(--cream);font:inherit;font-size:.93rem;padding:0 14px}
.field input{padding-left:40px}
.field svg{position:absolute;left:13px;top:23px;width:18px;height:18px;transform:translateY(-50%);color:var(--mute)}
.field input::placeholder{color:#7d6a5b}
.field input:focus-visible,.field select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.custom{margin-top:26px;padding:16px;border-radius:16px;border:1px dashed #C9B393;color:var(--mute);font-size:.9rem;line-height:1.55}
.custom b{display:block;color:var(--cream);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px;font-weight:600}
.custom a{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;color:var(--gold-2);font-weight:700;text-decoration:underline;text-underline-offset:4px}

/* showroom: three columns, photos with differing proportions so the rows never line up like a table */
.count{margin:0 0 18px;color:var(--mute);font-size:.92rem}
.floor{column-count:3;column-gap:26px}
.pc{break-inside:avoid;margin:0 0 34px;display:block}
.pic{position:relative;overflow:hidden;border-radius:6px 6px 6px 6px;background:#EADFC9}
.pc.a .pic{aspect-ratio:4/5}.pc.b .pic{aspect-ratio:1/1}.pc.c .pic{aspect-ratio:5/4}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pc:hover .pic img{transform:scale(1.045)}
/* brass hang tag: the one memorable element */
.tag{position:absolute;right:14px;top:0;display:flex;flex-direction:column;align-items:center}
.tag::before{content:"";width:2px;height:16px;background:rgba(255,236,200,.7)}
.tag span{position:relative;padding:14px 12px 10px;border-radius:4px 4px 10px 10px;background:linear-gradient(170deg,#F4D58F,#D9A441 60%,#BC8628);color:#2B1A12;font-weight:700;font-size:.95rem;box-shadow:0 10px 18px -8px rgba(0,0,0,.7)}
.tag span::before{content:"";position:absolute;left:50%;top:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#1B100A;box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.gl{position:absolute;left:12px;bottom:12px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.8rem;color:#fff;background:rgba(27,16,10,.55);border:1px solid rgba(255,236,200,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cap{padding:14px 2px 0}
.cap h3{margin:0 0 4px;font-family:var(--f-display);font-size:1.35rem;font-weight:600;line-height:1.2}
.cap .k{color:var(--gold-2);font-size:.86rem;font-weight:600;margin:0 0 6px}
.cap p{margin:0 0 12px;color:var(--mute);font-size:.92rem;line-height:1.55;max-width:44ch}
.vd{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--gold);color:var(--gold-2);font-weight:700;font-size:.9rem;transition:background .18s,color .18s}
.vd:hover{background:var(--gold);color:#2B1A12}
.vd:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.empty{padding:50px 20px;border:1.5px dashed #C9B393;border-radius:18px;text-align:center;color:var(--mute);column-span:all}
.empty b{display:block;font-family:var(--f-display);font-size:1.4rem;color:var(--cream);margin-bottom:6px;font-weight:600}
.empty button{all:unset;box-sizing:border-box;cursor:pointer;margin-top:14px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--cream);color:#FFF6E6;font-weight:700;display:inline-flex;align-items:center}


.pic{box-shadow:0 18px 30px -22px rgba(43,26,18,.5)}
.pc{position:relative}
.qv{position:absolute;left:50%;bottom:14px;transform:translate(-50%,16px);opacity:0;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,236,200,.5);color:#fff;font:700 .9rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:rgba(27,16,10,.55);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .2s;white-space:nowrap}
.pc:hover .qv,.pc:focus-within .qv{transform:translate(-50%,0);opacity:1}
.pc .gl{left:12px;top:12px;bottom:auto}
@media (hover:none){.qv{transform:translate(-50%,0);opacity:1}}
/* one outline per product: photo and caption together */
.pc{background:#fff;border:1px solid #D9C8AB;border-radius:18px;padding:8px 8px 16px;transition:border-color .2s,box-shadow .2s}
.pc:hover{border-color:#B7791F;box-shadow:0 20px 34px -26px rgba(43,26,18,.55)}
.pc .pic{border-radius:11px;box-shadow:none}
.pc .cap{padding:14px 10px 0}
.pc .tag{right:12px}
/* quick view:
.qd .g{border:0}
 photo box on the left, details on the right, both frosted glass over a blurred copy of the photo */
body.modal-open .snav{opacity:0;pointer-events:none;visibility:hidden}
.mod{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,10,5,.58);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.mod.on{display:flex}
.qd{--qh:calc(min(556px,100dvh - 40px) - 28px);position:relative;width:min(1040px,100%);height:min(556px,calc(100dvh - 40px));border-radius:26px;overflow:hidden;background:#2a1a10;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;box-shadow:0 60px 110px -30px rgba(0,0,0,.85)}
.qd-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4) brightness(.8);transform:scale(1.3)}
.qd::after{content:"";position:absolute;inset:0;background:rgba(20,10,5,.16);pointer-events:none}
.qd>*:not(.qd-bg){position:relative;z-index:1}
.qd-ph{margin:0;border-radius:18px;overflow:hidden;box-shadow:0 22px 40px -24px rgba(0,0,0,.7);background:rgba(255,255,255,.16)}
.qd-ph .blur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(24px) saturate(1.3);transform:scale(1.3);opacity:.85}
.qd-ph{align-self:center;justify-self:center;width:min(100%,calc(var(--qh) * var(--ar,1.1)));aspect-ratio:var(--ar,1.1)}
.qd-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0}
.qd .gl{left:14px;top:14px;bottom:auto;right:auto}
.gal{border:0;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(27,16,10,.5);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.gal.l{left:12px}.gal.r{right:12px}.gal:hover{background:rgba(27,16,10,.8)}
.dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(27,16,10,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dots button{all:unset;box-sizing:border-box;cursor:pointer;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);position:relative}
.dots button::after{content:"";position:absolute;inset:-12px}
.dots button[aria-current="true"]{background:#F4D58F;width:22px;border-radius:6px}
.dots button:focus-visible{outline:2px solid #F4D58F;outline-offset:3px}
.qd-pane{position:relative;border-radius:18px;padding:26px 28px 24px;display:flex;flex-direction:column;gap:14px;overflow:auto;
 background:linear-gradient(160deg,rgba(255,253,248,.84),rgba(255,246,230,.68));
 backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:0 30px 60px -28px rgba(0,0,0,.65)}
.qd-k{color:var(--gold-2);font-weight:700;font-size:.92rem;margin:0 0 4px;padding-right:48px}
.qd-pane h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.55rem,2.3vw,2rem);line-height:1.12;color:#2B1A12;padding-right:48px}
/* price: same font as the site, but on a dark walnut bar in gold so it is the first thing read */
.pricebox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,#2B1A12,#4B2F1E);box-shadow:0 16px 26px -16px rgba(43,26,18,.9)}
.pricebox span{color:#E7D5B6;font-size:.86rem;font-weight:600}
.pricebox strong{font-family:var(--f-body);font-weight:700;font-size:clamp(1.8rem,2.8vw,2.25rem);line-height:1;color:#F6D98E;letter-spacing:-.02em}
.qd-pane p.d{margin:0;color:#5b4739;line-height:1.6;font-size:.95rem;max-width:46ch}
.info{display:grid;gap:8px;padding-top:4px}
.ir{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;font-size:.93rem}
.ir dt{color:#6B5748;font-weight:600}.ir dd{margin:0;color:#2B1A12;font-weight:600}
.lbl{display:block;color:#6B5748;font-size:.9rem;font-weight:600;margin:4px 0 8px}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dm{padding:10px 10px 9px;border-radius:12px;background:rgba(255,255,255,.62);text-align:center}
.dm small{display:block;color:#6B5748;font-size:.76rem;font-weight:600}
.dm b{display:block;font-size:1.3rem;line-height:1.25;color:#2B1A12}.dm b i{font-style:normal;font-size:.78rem;font-weight:600;color:#6B5748;margin-left:2px}
.dm em{display:block;font-style:normal;font-size:.74rem;color:#7a6556}
.qd-act{margin-top:auto;padding-top:6px}
.qd-act .vd{display:flex;justify-content:center;min-height:52px;font-size:.98rem;background:linear-gradient(180deg,#EFC56B,#C98F2B);border-color:transparent;color:#2B1A12;box-shadow:0 12px 22px -10px rgba(185,121,31,.95)}
.qd-act .vd:hover{background:linear-gradient(180deg,#F4D58F,#D39A32);color:#2B1A12}
.qx{border:0;position:absolute!important;right:26px;top:26px;z-index:5!important;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.6);color:#2B1A12;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.qx:hover{background:rgba(255,255,255,.9)}.qx:focus-visible,.gal:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gal{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.qd-pane{scrollbar-width:none}.qd-pane::-webkit-scrollbar{display:none}

@media (max-height:700px) and (min-width:861px){.qd{height:calc(100dvh - 24px)}.mod{padding:12px}.qd-pane{padding:18px 24px 16px;gap:10px}.pricebox{padding:10px 16px}.pricebox strong{font-size:1.7rem}.qd-pane p.d{font-size:.9rem;line-height:1.5}.dm{padding:7px 8px}.dm b{font-size:1.15rem}.lbl{margin:0 0 6px}.qd-act .vd{min-height:46px}.qd-pane h2{font-size:1.5rem}}
@media (max-width:860px){.mod{align-items:flex-end;padding:0}.qd{--qh:calc((94dvh - 30px)*.28);width:100%;height:94dvh;border-radius:24px 24px 0 0;grid-template-columns:1fr;grid-template-rows:minmax(0,28%) minmax(0,1fr);gap:10px;padding:10px}
 .qd-pane{padding:18px 16px 14px;gap:10px}.pricebox{padding:10px 14px}.dm{padding:7px 6px}.qx{right:22px;top:22px}.pricebox strong{font-size:1.8rem}}
@media (max-width:1180px){.floor{column-count:2}}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:18px}.idx{position:static;min-width:0}.cats{display:flex;gap:8px;overflow-x:auto;border:0;scrollbar-width:none;margin-bottom:14px}.cats::-webkit-scrollbar{display:none}.cats li{flex:none}
 .cats button{border:1.5px solid var(--line);border-radius:999px;padding:0 16px;gap:8px;font-family:var(--f-body);font-size:.92rem;font-weight:600;min-height:44px;width:auto}.cats button:hover,.cats button[aria-pressed="true"]{padding-left:16px}
 .cats button[aria-pressed="true"]{background:#5A3524;border-color:#5A3524;color:#FFF6E6;box-shadow:none}.cats button[aria-pressed="true"] small{color:#F4D58F}
 .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.custom{display:none}.idx .lede{margin-bottom:18px}}
@media (max-width:560px){.floor{column-count:1}.tools{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.pc:hover .pic img{transform:none}}

const CATS=['All','Table','Chair','Cabinet','Bed','Sofa'];
const peso=n=>'₱'+n.toLocaleString('en-PH');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat='All',q='',sort='feat';const SH=['a','b','c'];
function draw(){
 document.getElementById('cats').innerHTML=CATS.map(c=>{const n=c==='All'?P.length:P.filter(p=>p.cat===c).length;return `<li><button type="button" data-c="${c}" aria-pressed="${c===cat}">${c}<small>${n}</small></button></li>`}).join('');
 document.querySelectorAll('#cats button').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.c;draw()}));
 let l=P.filter(p=>(cat==='All'||p.cat===cat)&&(!q||(p.name+' '+p.d).toLowerCase().includes(q.toLowerCase())));
 if(sort==='lo')l=[...l].sort((a,b)=>a.p-b.p);if(sort==='hi')l=[...l].sort((a,b)=>b.p-a.p);
 cur=l;document.getElementById('count').textContent=l.length===1?'1 piece':l.length+' pieces';
 const f=document.getElementById('floor');
 if(!l.length){f.innerHTML=`<div class="empty"><b>${q?'Nothing matches “'+esc(q)+'”':'No '+cat.toLowerCase()+' pieces yet'}</b>Try another category, or ask us to build one to your size.<br><button type="button" id="clr">Clear filters</button></div>`;
  document.getElementById('clr').addEventListener('click',()=>{cat='All';q='';document.getElementById('q').value='';draw()});return}
 f.innerHTML=l.map((p,i)=>`<article class="pc ${SH[i%3]}"><div class="pic"><img src="${PH[p.img]}" alt="${esc(p.name)}" loading="lazy"><div class="tag"><span>${peso(p.p)}</span></div>${p.tag?`<span class="gl">${p.tag}</span>`:''}<button class="qv" type="button" data-i="${i}"><svg width="18" height="18" aria-hidden="true"><use href="#eye"/></svg>Quick view</button></div><div class="cap"><h3>${p.name}</h3><p class="k">${p.cat}</p><p>${p.d}</p><a class="vd" href="#">View details</a></div></article>`).join('');
 document.querySelectorAll('.qv').forEach(b=>b.addEventListener('click',()=>openQ(+b.dataset.i,b)));
}

let cur=[],ci=0,gi=0,lastBtn=null;
function showQ(){const p=cur[ci];const im=p.imgs;const src=PH[im[gi]];const t=new Image();t.src=src;return (t.decode?t.decode():Promise.resolve()).catch(()=>{}).then(()=>build(p,im,src,(t.naturalWidth&&t.naturalHeight)?t.naturalWidth/t.naturalHeight:1.1))}
function build(p,im,src,ar){const inch=p.z.map(v=>(v/2.54).toFixed(1));const nm=['Length','Width','Height'];
 document.getElementById('qd').innerHTML=`<div class="qd-bg" style="background-image:url('${src}')"></div>
 <figure class="qd-ph" style="--ar:${ar}"><img src="${src}" alt="${esc(p.name)}${im.length>1?', photo '+(gi+1)+' of '+im.length:''}">${p.tag?`<span class="g tag-pill gl">${p.tag}</span>`:''}
 ${im.length>1?`<button class="gal l" type="button" id="gp" aria-label="Previous photo"><svg width="20" height="20" aria-hidden="true"><use href="#chl"/></svg></button><button class="gal r" type="button" id="gn" aria-label="Next photo"><svg width="20" height="20" aria-hidden="true"><use href="#chr"/></svg></button><div class="dots" role="group" aria-label="Choose photo">${im.map((_,k)=>`<button type="button" data-k="${k}" aria-label="Photo ${k+1}" aria-current="${k===gi}"></button>`).join('')}</div>`:''}</figure>
 <div class="qd-pane"><button class="qx" type="button" id="qx" aria-label="Close quick view"><svg width="20" height="20" aria-hidden="true"><use href="#cls"/></svg></button>
 <div><p class="qd-k">${p.cat}</p><h2 id="qT">${p.name}</h2></div>
 <div class="pricebox"><span>Price</span><strong>${peso(p.p)}.00</strong></div>
 <p class="d">${p.d}</p>
 <dl class="info"><div class="ir"><dt>Material</dt><dd>${p.m}</dd></div><div class="ir"><dt>Finish</dt><dd>${p.f}</dd></div></dl>
 <div><span class="lbl">Size</span><div class="dims">${p.z.map((v,k)=>`<div class="dm"><small>${nm[k]}</small><b>${v}<i>cm</i></b><em>${inch[k]} in</em></div>`).join('')}</div></div>
 <div class="qd-act"><a class="vd" href="#">View full details</a></div></div>`;
 document.getElementById('qx').addEventListener('click',closeQ);
 const a=document.getElementById('gp'),b=document.getElementById('gn');a&&a.addEventListener('click',()=>{gi=(gi-1+im.length)%im.length;showQ().then(()=>document.getElementById('gp').focus())});b&&b.addEventListener('click',()=>{gi=(gi+1)%im.length;showQ().then(()=>document.getElementById('gn').focus())});
 document.querySelectorAll('.dots button').forEach(d=>d.addEventListener('click',()=>{gi=+d.dataset.k;showQ().then(()=>document.querySelector('.dots button[aria-current=true]').focus())}))}
function openQ(i,btn){lastBtn=btn;ci=i;gi=0;showQ().then(()=>{document.getElementById('mod').classList.add('on');document.body.classList.add('modal-open');document.getElementById('qx').focus()})}
function closeQ(){document.getElementById('mod').classList.remove('on');document.body.classList.remove('modal-open');lastBtn&&lastBtn.focus()}
document.getElementById('mod').addEventListener('click',e=>{if(e.target.id==='mod')closeQ()});
addEventListener('keydown',e=>{if(!document.body.classList.contains('modal-open'))return;const n=cur[ci].imgs.length;if(e.key==='Escape')closeQ();if(n>1&&e.key==='ArrowRight'){gi=(gi+1)%n;showQ()}if(n>1&&e.key==='ArrowLeft'){gi=(gi-1+n)%n;showQ()}});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();draw()});
document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;draw()});

function renderLinks(){
  document.getElementById('links').innerHTML=ITEMS[who].map(([t,h,ic,x,cls])=>{
    const cur=(t==='Home')?' cur':'';
    const icon=ic?`<svg class="ic" aria-hidden="true"><use href="#${ic}"/></svg>`:'';
    const extra=(ic==='i-cart')?`<span class="cnt" aria-label="2 items">${x}</span>`:(x==='pip'?'<span class="pip" aria-label="unread"></span>':'');

}

let lastY=scrollY,collapsed=false,peek=false,peekT=null;
const coarse=matchMedia('(pointer:coarse)').matches;
const setCollapsed=c=>{ if(c===collapsed)return; collapsed=c; snav.classList.toggle('collapsed',c);
  links.toggleAttribute('inert',c); burger.toggleAttribute('inert',c); };
const menuOpen=()=>snav.classList.contains('open');
const focusInside=()=>snav.contains(document.activeElement)&&document.activeElement!==document.body&&document.activeElement!==logo;
function onScroll(){
  const y=scrollY,d=y-lastY; if(Math.abs(d)<DELTA&&y>TOP){return}
  if(y<=TOP){setCollapsed(false)}
  else if(d>0&&y>HIDE_AFTER&&!menuOpen()&&!focusInside()&&!peek){setCollapsed(true)}
  else if(d<0){setCollapsed(false)}
  lastY=y;
}
addEventListener('scroll',onScroll,{passive:true});
// hover (mouse) shows the bar; leaving hides it again after a short delay if we are scrolled down
const show=()=>{clearTimeout(peekT);peek=true;setCollapsed(false)};
const maybeHide=()=>{clearTimeout(peekT);peekT=setTimeout(()=>{peek=false;if(scrollY>HIDE_AFTER&&!menuOpen()&&!focusInside())setCollapsed(true)},700)};
logo.addEventListener('mouseenter',()=>{if(!coarse)show()});
snav.addEventListener('mouseleave',()=>{if(!coarse&&peek)maybeHide()});
snav.addEventListener('focusin',e=>{ if(collapsed) setCollapsed(false) });
// touch: first tap on a collapsed logo reveals the bar instead of navigating
logo.addEventListener('click',e=>{ if(collapsed&&coarse){e.preventDefault();show();maybeHide();} });
burger.addEventListener('click',()=>{const o=!snav.classList.contains('open');snav.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);burger.setAttribute('aria-label',o?'Close menu':'Open menu')});
addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen()){burger.click();burger.focus()}});


(function(){const sn=document.getElementById('snav');
 function pick(){const col=sn.classList.contains('collapsed');const x=col?60:innerWidth/2,y=col?26:46;
  const els=document.elementsFromPoint(x,y).filter(e=>!sn.contains(e));
  let t='light';for(const e of els){const h=e.closest&&e.closest('[data-nav]');if(h){t=h.dataset.nav;break}}
  sn.classList.toggle('light',t==='light')}
 addEventListener('scroll',pick,{passive:true});addEventListener('resize',pick);
 new MutationObserver(pick).observe(sn,{attributes:true,attributeFilter:['class']});pick()})();
</script></body></html>
